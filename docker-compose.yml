# Full stack:  docker compose up --build    then open http://localhost:3005
#   Console: admin@foyer.test / foyer-admin (ops@foyer.test / foyer-viewer is read-only)
#   Waiting rooms: http://localhost:3005/q/echoes-mumbai   (demo shop behind it: http://localhost:3006)

x-java: &java
  restart: unless-stopped
  environment: &java-env
    REDIS_HOST: redis
    KAFKA_BOOTSTRAP: kafka:9092
    DB_HOST: postgres
    DB_USER: foyer
    DB_PASSWORD: foyer
    JWT_SECRET: ${JWT_SECRET:-change-me-in-production-this-is-a-32+-byte-dev-secret}
    ROOM_SERVICE_URL: http://room-service:8301
    QUEUE_URL: http://queue-service:8302
    INSIGHT_URL: http://insight-service:8303
    SHOP_URL: http://localhost:3006
    FOYER_SIM_KEY: ${FOYER_SIM_KEY:-dev-rehearsal-key-change-me}
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    kafka: { condition: service_healthy }

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: foyer
      POSTGRES_PASSWORD: foyer
      POSTGRES_DB: foyer
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foyer"]
      interval: 5s
      retries: 20
    mem_limit: 256m

  redis:
    image: redis:8-alpine
    # Queue state must survive a restart: append-only file, fsync every second.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "200mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
    mem_limit: 256m

  kafka:
    image: apache/kafka:3.9.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx320m -Xms320m"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      retries: 20
    mem_limit: 640m

  room-service:
    <<: *java
    build: { context: ., target: room-service }
    image: foyer/room-service:1.0.0
    environment:
      <<: *java-env
      DB_NAME: rooms
    healthcheck: &health
      test: ["CMD", "curl", "-fs", "http://localhost:8301/actuator/health/readiness"]
      interval: 10s
      retries: 30
      start_period: 30s
    mem_limit: 448m

  queue-service:
    <<: *java
    build: { context: ., target: queue-service }
    image: foyer/queue-service:1.0.0
    environment:
      <<: *java-env
      FOYER_SIGNING_PRIVATE_KEY: ${FOYER_SIGNING_PRIVATE_KEY:-MC4CAQAwBQYDK2VwBCIEIPqKVERPD332SISNf8T/oEf3YKpRXW82EMiLygs1LYB4}
      FOYER_SIGNING_PUBLIC_KEY: ${FOYER_SIGNING_PUBLIC_KEY:-MCowBQYDK2VwAyEAe0SzCg6LmkTyEeuD5dx7FxBZ97tCp17pNtyCyJylEsQ=}
      FOYER_TICKET_SECRET: ${FOYER_TICKET_SECRET:-dev-ticket-secret-change-me-32-bytes}
      FOYER_POW_SECRET: ${FOYER_POW_SECRET:-dev-pow-secret-change-me-32-bytes!!}
    depends_on:
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      room-service: { condition: service_healthy }
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fs", "http://localhost:8302/actuator/health/readiness"]
    ports: ["8087:8302"]
    mem_limit: 448m

  # A second queue-service for the failover drill (scripts/chaos-test.sh): docker compose --profile ha up -d queue-service-b.
  # It serves no visitors here; it only competes for the admission lease, as a second replica in Kubernetes would.
  queue-service-b:
    extends: { service: queue-service }
    profiles: ["ha"]
    ports: !reset []
    mem_limit: 384m

  insight-service:
    <<: *java
    build: { context: ., target: insight-service }
    image: foyer/insight-service:1.0.0
    environment:
      <<: *java-env
      DB_NAME: insight
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fs", "http://localhost:8303/actuator/health/readiness"]
    mem_limit: 448m

  edge-gateway:
    <<: *java
    build: { context: ., target: edge-gateway }
    image: foyer/edge-gateway:1.0.0
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health/readiness"]
    ports: ["8086:8080"]
    mem_limit: 320m

  demo-shop:
    build: { context: ., target: demo-shop }
    image: foyer/demo-shop:1.0.0
    restart: unless-stopped
    environment:
      FOYER_URL: http://queue-service:8302
      WAITING_ROOM_BASE: http://localhost:3005/q/
      SHOP_ADMIN_KEY: ${SHOP_ADMIN_KEY:-dev-shop-admin}
    depends_on:
      queue-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8304/actuator/health/readiness"]
      interval: 10s
      retries: 30
      start_period: 30s
    ports: ["3006:8304"]
    mem_limit: 256m

  frontend:
    build: { context: ., dockerfile: frontend/Dockerfile }
    image: foyer/frontend:1.0.0
    restart: unless-stopped
    depends_on: [edge-gateway]
    ports: ["3005:80"]
    mem_limit: 64m

volumes:
  pgdata:
  redisdata:
  kafkadata:
