server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64k;

    # This nginx is the edge: it REPLACES X-Forwarded-For with the real peer address. Appending would keep whatever the
    # client sent first, and queue-service rate-limits on the first entry, so a client could pick its own IP.
    location /api/ {
        proxy_pass http://edge-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location = /.well-known/foyer-keys {
        proxy_pass http://edge-gateway:8080;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # The tag isn't content-hashed: let sites pick up fixes within minutes.
    location = /foyer.js {
        add_header Cache-Control "public, max-age=300";
        add_header Access-Control-Allow-Origin "*";
    }

    location ~* \.(js|css|woff2?|png|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
