spring:
  application:
    name: room-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rooms}
    username: ${DB_USER:foyer}
    password: ${DB_PASSWORD:foyer}
    hikari:
      maximum-pool-size: 10
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 5

server:
  port: ${PORT:8301}
  shutdown: graceful

foyer:
  jwt-secret: ${JWT_SECRET:change-me-in-production-this-is-a-32+-byte-dev-secret}
  queue-url: ${QUEUE_URL:http://localhost:8302}
  shop-url: ${SHOP_URL:http://localhost:3006}
  seed-demo: ${SEED_DEMO:true}
  sim-key: ${FOYER_SIM_KEY:dev-rehearsal-key-change-me}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
